<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route</title>
    <link rel="icon" href="../favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/map.css">
    <link rel="stylesheet" href="../css/route.css">
</head>

<body class="blog-theme">
<div class="header">
    <div class="header-row">
        <div class="header-left">
            <a class="header-btn" href="index.html" title="Back">&larr;</a>
        </div>
        <h1 id="route-title" class="page-title">Route</h1>
        <div class="header-right">
            <img class="logo" src="../img/logo.png" alt="Logo">
        </div>
    </div>
    <div class="scenario-meta-row">
        <div class="scenario-meta" id="route-meta"></div>
    </div>
</div>

<div class="main-layout">
    <aside class="left-column">
        <div id="left-column"></div>
    </aside>

    <section class="right-column">
        <div class="big-map">
            <h3 class="section-title" style="margin-top:0;">Route map</h3>
            <div class="map-toolbar">
                <div class="route-type-selector">
                    <button data-type="t1">Type 1</button>
                    <button data-type="t2">Type 2</button>
                    <button data-type="both" class="active">Both</button>
                </div>
            </div>
            <div id="route-map"></div>
        </div>
    </section>
</div>

<section class="route-details-section">
    <h2 class="section-title">Routes</h2>
    <div id="t1-tables" class="route-tables"></div>
    <div id="t2-tables" class="route-tables"></div>
</section>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="../js/vendor/leaflet.textpath.js"></script>
<script type="module" src="../js/pages/route_page.js"></script>
</body>
</html>
