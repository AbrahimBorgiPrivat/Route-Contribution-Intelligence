name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure repository is public
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "This workflow is intentionally blocked for private repositories."
            echo "Make the repository public before publishing this GitHub Pages site."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GH_PAGES_ADMIN_TOKEN || github.token }}
          enablement: ${{ secrets.GH_PAGES_ADMIN_TOKEN != '' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Pages bundle
        run: python scripts/build_pages_bundle.py --output .pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
