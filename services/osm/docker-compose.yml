version: "3.8"

services:
  osm-snap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osm-snap
    env_file:
      - .env
    working_dir: /app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 5010
      --log-level info
    ports:
      - "5010:5010"
    volumes:
      - ./data/build:/data/build:ro
    restart: unless-stopped
