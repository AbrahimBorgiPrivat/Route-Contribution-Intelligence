<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FK Rute Oversigt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        :root {
            --nm-blue: #004B6B;
            --nm-gray-bg: #F7F9FA;
            --nm-card-bg: #FFFFFF;
            --nm-border: #D9DEE2;
            --nm-hover: #EFF2F5;
        }
        body {
            margin: 0;
            padding: 0 40px;
            font-family: 'Inter', sans-serif;
            background: var(--nm-gray-bg);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            background: var(--nm-card-bg);
        }
        .logo { width: 100px; }
        h1 { color: var(--nm-blue); font-size: 42px; margin: 0; }
        .section-title { font-size: 28px; color: var(--nm-blue); margin-top: 40px; font-weight: 700; }
        .big-map {
            margin-top: 40px;
            border: 1px solid var(--nm-border);
            border-radius: 12px;
            background: var(--nm-card-bg);
            height: 80vh;
            padding: 10px;
        }
        iframe { width: 100%; height: 95%; border-radius: 10px; border: none; }
        .btn-route {
            background: var(--nm-blue);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="header">
    <h1>FK Ruteoversigt</h1>
    <img class="logo" src="img/northmedia-logo.png">
</div>
<h2 class="section-title">Ruteoversigt</h2>
<table id="route-table" class="display">
    <thead>
        <tr>
            {% for kpi in kpis %}
                <th>{{ kpi.name }}</th>
            {% endfor %}
            <th>Åben Rute</th>
        </tr>
    </thead>
    <tbody>
        {% for row in routes %}
        <tr>
            {% for kpi in kpis %}
                <td>
                    {% if row[kpi.key] is number %}
                        {{ "%.0f"|format(row[kpi.key]) }}
                    {% else %}
                        {{ row[kpi.key] }}
                    {% endif %}
                </td>
            {% endfor %}
            <td>
                <a class="btn-route" href="routes/route_{{ row.route_id }}.html">Åben</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<h2 class="section-title">Samlet Ruter</h2>
<div class="big-map">
    <iframe src="{{ map_file }}"></iframe>
</div>
<script>
$(document).ready(function() {
    $('#route-table').DataTable({
        pageLength: 20,
        lengthChange: false,
        info: false
    });
});
</script>
</body>
</html>
